<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 最新消息</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="container">
    <h1 style="text-align: center; margin-bottom: 1.5rem; color: #0f172a;">📢 最新消息與公告</h1>
    <div id="news-container">⏳ 最新消息載入中...</div>
  </main>

  <script src="./js/header.js"></script>

  <script>
    // ⚠️ 請替換為您部署後發佈的 Web App 網址 (結尾必須是 /exec)
    const GAS_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    function handleNewsData(data) {
      const container = document.getElementById('news-container');
      if (!container) return;

      if (!data || data.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>目前尚無最新消息。</p>";
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="news-card">
          <span style="color: #0284c7; font-weight: bold; font-size: 0.9rem;">${item.date || ''}</span>
          <h3 style="margin: 5px 0; color: #1e293b;">${item.title || ''}</h3>
          <p style="color: #475569; margin: 0; line-height: 1.5;">${item.content || ''}</p>
        </div>
      `).join('');
    }

    function fetchNews() {
      const script = document.createElement('script');
      script.src = `${GAS_URL}?callback=handleNewsData`;
      script.onerror = function() {
        document.getElementById('news-container').innerHTML = 
          "<p style='color:red; text-align:center;'>❌ 消息載入失敗，請確認 GAS 網址或部署權限設定。</p>";
      };
      document.body.appendChild(script);
    }

    document.addEventListener("DOMContentLoaded", fetchNews);
  </script>

</body>
</html>
