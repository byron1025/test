<!-- 1. 確定 HTML 頁面中有這個容器 -->
<div id="news-container">⏳ 最新消息載入中...</div>

<!-- 2. 在頁面底部加上 JavaScript -->
<script>
  // ⚠️ 請把下方網址替換為您第一步複製的 GAS 網址 (結尾必須是 /exec)
  const GAS_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

  // 這是一個全域回調函數，當 JSONP 抓完資料時會自動執行
  function handleNewsData(data) {
    const container = document.getElementById('news-container');
    if (!container) return;

    if (!data || data.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>目前尚無最新消息。</p>";
      return;
    }

    container.innerHTML = data.map(item => `
      <div class="news-card" style="border-bottom: 1px solid #e2e8f0; padding: 15px 0; margin-bottom: 10px;">
        <span style="color: #0284c7; font-weight: bold; display: block;">${item.date || ''}</span>
        <h3 style="margin: 5px 0; font-size: 1.2rem; color: #1e293b;">${item.title || ''}</h3>
        <p style="color: #475569; margin: 0; line-height: 1.5;">${item.content || ''}</p>
      </div>
    `).join('');
  }

  // 利用動態插入 <script> 標籤呼叫 API，徹底避開跨網域 (CORS) 阻擋
  function fetchNewsWithJSONP() {
    const script = document.createElement('script');
    script.src = `${GAS_URL}?callback=handleNewsData`;
    script.onerror = function() {
      const container = document.getElementById('news-container');
      if (container) {
        container.innerHTML = "<p style='color:red; text-align:center;'>❌ 消息載入失敗，請檢查網路連線或 GAS 網址。</p>";
      }
    };
    document.body.appendChild(script);
  }

  // 當網頁載入完成後執行
  document.addEventListener("DOMContentLoaded", fetchNewsWithJSONP);
</script>
