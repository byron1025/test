<script>
  document.addEventListener("DOMContentLoaded", function () {
    const newsContainer = document.getElementById("news-container");
    
    // ⚠️ 請務必替換為您 GAS 管理部署後複製的 /exec 網址
    const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbzbpSh2Nv5vClTSdZhPyG5IsQlQcuxRKmwbyy5FnpZa2ICyp4A-o3P-zB5gaIA3N_FX/execc";
    
    // 自動加上時間戳記防止快存
    const fetchUrl = BASE_GAS_URL + (BASE_GAS_URL.includes('?') ? '&' : '?') + "t=" + Date.now();

    fetch(fetchUrl, {
      method: 'GET',
      redirect: 'follow'
    })
    .then(response => {
      if (!response.ok) {
        throw new Error("HTTP 狀態碼非 200");
      }
      return response.json();
    })
    .then(data => {
      if (!data || !data.news || data.news.length === 0) {
        newsContainer.innerHTML = '<div class="loading-text">目前尚無最新消息。</div>';
        return;
      }

      newsContainer.innerHTML = "";

      data.news.forEach(item => {
        const cardHTML = `
          <article class="news-card">
            <div class="news-header">
              <span class="news-badge">${item.category || "公告"}</span>
              <span class="news-date">📅 ${item.date || ""}</span>
            </div>
            <h2 class="news-title">${item.title || "無標題"}</h2>
            <p class="news-content">${item.content || ""}</p>
          </article>
        `;
        newsContainer.insertAdjacentHTML("beforeend", cardHTML);
      });
    })
    .catch(error => {
      console.error("資料讀取失敗：", error);
      newsContainer.innerHTML = `
        <div class="news-card" style="border-color: #dc2626; border-top-color: #dc2626; text-align: center;">
          <h3 style="color: #dc2626; margin-bottom: 0.5rem;">⚠️ 最新消息讀取失敗</h3>
          <p style="font-size: 0.9rem;">請確認 GAS Web App 部署網址是否正確，且權限已設定為「所有人」。</p>
        </div>
      `;
    });
  });
</script>
