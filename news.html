<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新消息 - 捷安特富國自行車店</title>
  
  <meta name="description" content="捷安特富國自行車店最新動態、門市公告、優惠活動與保養知識。">
  
  <link rel="stylesheet" href="./css/style.css">
  
  <style>
    .page-title-section {
      background: var(--primary-blue);
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      border-bottom: 5px solid var(--accent-yellow);
    }
    .page-title-section h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .page-title-section p { color: #cbd5e1; font-size: 1rem; }

    /* 最新消息卡片清單 */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto 3rem auto;
    }
    
    .news-item-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem;
      border: 2px solid var(--brand-blue);
      border-left: 6px solid var(--accent-yellow);
      box-shadow: var(--shadow);
    }

    .news-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }

    .news-badge {
      background: var(--accent-red);
      color: white;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .news-date {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .news-title {
      font-size: 1.25rem;
      color: var(--primary-blue);
      margin-bottom: 0.75rem;
    }

    .news-content {
      font-size: 0.95rem;
      color: var(--text-dark);
      line-height: 1.6;
      white-space: pre-wrap; /* 保持試算表內的換行格式 */
    }
  </style>
</head>
<body>

  <main class="container">
    <section class="page-title-section">
      <h1>📢 最新消息與門市公告</h1>
      <p>即時掌握門市活動、保養知識與營業時間調整資訊</p>
    </section>

    <!-- 最新消息展示區域 -->
    <div class="news-list" id="news-container">
      <div style="text-align: center; color: #64748b; padding: 2rem;">
        🔄 正在讀取最新消息...
      </div>
    </div>
  </main>

  <script src="./js/header.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const newsContainer = document.getElementById("news-container");

      // ⚠️ 請填寫您的 GAS Web App 部署網址 (/exec 結尾)
      const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbxE7J9m5al15GNVCHFtIZrWd4JjHW8ZVQkay2NyivmBBc93lEm-rPUGZb446Pvs-O5Z/exec";
      const fetchUrl = BASE_GAS_URL + (BASE_GAS_URL.includes('?') ? '&' : '?') + "t=" + Date.now();

      fetch(fetchUrl, { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(data => {
          if (!data || !data.news || data.news.length === 0) {
            newsContainer.innerHTML = '<div style="text-align: center; color: #64748b; padding: 2rem;">目前尚無公告消息。</div>';
            return;
          }

          newsContainer.innerHTML = "";

          // 💡 反轉陣列 (.reverse())：將最新發布（位於試算表最下方）的消息排在最前面
          const newsList = data.news.slice().reverse();

          newsList.forEach(item => {
            const cardHTML = `
              <article class="news-item-card">
                <div class="news-header">
                  <span class="news-badge">${item.category || "公告"}</span>
                  <span class="news-date">📅 ${item.date || ""}</span>
                </div>
                <h2 class="news-title">${item.title || "最新消息"}</h2>
                <div class="news-content">${item.content || ""}</div>
              </article>
            `;
            newsContainer.insertAdjacentHTML("beforeend", cardHTML);
          });
        })
        .catch(err => {
          console.error("讀取消息失敗:", err);
          newsContainer.innerHTML = '<div style="text-align: center; color: #dc2626; padding: 2rem;">無法載入最新消息，請稍後再試。</div>';
        });
    });
  </script>
</body>
</html>
