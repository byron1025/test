<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 門市資訊</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px 40px; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
    .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: #38bdf8; font-weight: bold; }
    .form-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; max-width: 500px; margin: 40px auto; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #e2e8f0; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    .btn { display: inline-block; background: #38bdf8; color: #0f172a; padding: 10px 24px; border-radius: 25px; font-weight: bold; border: none; cursor: pointer; width: 100%; }
    .contact-box { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); border: 1px solid #4338ca; border-radius: 12px; padding: 30px; text-align: center; }
    .footer { border-top: 1px solid #1e293b; padding-top: 20px; text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 60px; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="logo">🚲 富國腳踏車店</a>
      <div class="nav-links">
        <a href="index.html">關於我們</a>
        <a href="services.html">服務與試算</a>
        <a href="products.html">精選車款</a>
        <a href="contact.html" class="active">門市資訊</a>
      </div>
    </nav>

    <div class="form-box">
      <h3 style="margin-bottom: 15px; text-align: center; color: #38bdf8;">📅 線上預約保養 / 賞車</h3>
      <form onsubmit="handleBooking(event)">
        <div class="form-group">
          <label>姓名：</label>
          <input type="text" required placeholder="請輸入您的姓名">
        </div>
        <div class="form-group">
          <label>聯絡電話：</label>
          <input type="tel" required placeholder="0912-345-678">
        </div>
        <div class="form-group">
          <label>預約日期：</label>
          <input type="date" required>
        </div>
        <button type="submit" class="btn">送出預約</button>
      </form>
    </div>

    <div class="contact-box">
      <h3 style="color: #818cf8;">📍 門市地點</h3>
      <p style="margin-top: 10px; color: #e2e8f0;">📞 服務專線：歡迎來電洽詢</p>
      <p style="color: #e2e8f0;">⏱️ 營業時間：週一至週六 10:00 - 21:00（週日公休）</p>
      <p style="color: #e2e8f0;">🏠 門市地址：歡迎親臨現場</p>
    </div>

    <footer class="footer">© 2026 富國腳踏車店 All Rights Reserved.</footer>
  </div>

  <script>
    function handleBooking(e) {
      e.preventDefault();
      alert('🎉 預約成功！富國腳踏車店專人將盡快與您聯繫確認細節！');
    }
  </script>
</body>
</html>
