<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 門市與維修預約</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #334155; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
    header { background-color: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; text-decoration: none; font-weight: bold; }
    nav a { margin-left: 1.5rem; color: #cbd5e1; text-decoration: none; }
    nav a:hover { color: white; }
    footer { text-align: center; padding: 2rem; background: #0f172a; color: #94a3b8; margin-top: 3rem; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

  <main class="container">
    <h1 style="text-align: center; margin-bottom: 1.5rem; color: #0f172a;">📍 門市資訊與線上預約</h1>

    <div class="features">
      <!-- 門市資訊卡片 -->
      <div class="card">
        <h3 style="color: #0284c7; margin-bottom: 1rem; font-size: 1.25rem;">門市聯絡資訊</h3>
        <p style="margin-bottom: 0.8rem;"><strong>📞 電話：</strong> (02) 2345-6789</p>
        <p style="margin-bottom: 0.8rem;"><strong>🕒 營業時間：</strong> 週一至週六 10:00 - 21:00 (週日公休)</p>
        <p><strong>📍 店址：</strong> 台北市中山區富國路 123 號</p>
      </div>

      <!-- 線上預約表單卡片 -->
      <div class="card">
        <h3 style="color: #0284c7; margin-bottom: 1rem; font-size: 1.25rem;">線上預約維修 / 保養</h3>
        <form id="booking-form" onsubmit="submitBooking(event)">
          <div style="margin-bottom: 12px;">
            <label style="display:block; font-size: 0.9rem; margin-bottom: 4px; font-weight: 500;">姓名</label>
            <input type="text" id="name" placeholder="請輸入姓名" required style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
          </div>
          <div style="margin-bottom: 12px;">
            <label style="display:block; font-size: 0.9rem; margin-bottom: 4px; font-weight: 500;">電話</label>
            <input type="tel" id="phone" placeholder="請輸入聯絡電話" required style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
          </div>
          <div style="margin-bottom: 18px;">
            <label style="display:block; font-size: 0.9rem; margin-bottom: 4px; font-weight: 500;">預約項目</label>
            <select id="service" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: white;">
              <option>全車定期保養</option>
              <option>煞車 / 變速系統微調</option>
              <option>外胎更換 / 補胎</option>
              <option>新車試乘與諮詢</option>
            </select>
          </div>
          <button type="submit" id="submit-btn" style="width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">確認送出預約</button>
        </form>
      </div>
    </div>
  </main>

  <script src="./js/header.js"></script>

 <script>
    // ⚠️ 請替換為你 GAS 部署的 Web App 網址 (/exec 結尾)
    const GAS_BOOKING_URL = "https://script.google.com/macros/s/AKfycbzgGeMgSS64GDWGKKwZFMbAY1WBUfcSvToe4LZ8TPZoHBtEe4nvj5cWfoO-F6m166-wAw/exec";

    function submitBooking(event) {
      event.preventDefault();

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = "資料傳送中...";

      // 將資料打包成表單格式，避免被 Google 擋跨域
      const formData = new URLSearchParams();
      formData.append('name', document.getElementById('name').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('service', document.getElementById('service').value);

      fetch(GAS_BOOKING_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      })
      .then(() => {
        alert('🎉 預約資料已成功送出！');
        document.getElementById('booking-form').reset();
      })
      .catch(err => {
        alert('❌ 傳送失敗，請稍後再試。');
        console.error(err);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "確認送出預約";
      });
    }
  </script>
</body>
</html>
