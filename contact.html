<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 門市與維修預約</title>
  <!-- ⚠️ 關鍵 1：確認 CSS 引入路徑正確 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="container">
    <h1 style="text-align: center; margin-bottom: 1.5rem; color: #0f172a;">📍 門市資訊與線上預約</h1>

    <div class="features" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
      <!-- 門市資訊卡片 -->
      <div class="card">
        <h3 style="color: #0284c7; margin-bottom: 1rem;">聯絡資訊</h3>
        <p><strong>📞 電話：</strong> (02) 2345-6789</p>
        <p style="margin-top: 0.5rem;"><strong>🕒 營業時間：</strong> 週一至週六 10:00 - 21:00 (週日公休)</p>
        <p style="margin-top: 0.5rem;"><strong>📍 店址：</strong> 台北市中山區富國路 123 號</p>
      </div>

      <!-- 線上預約表單卡片 -->
      <div class="card">
        <h3 style="color: #0284c7; margin-bottom: 1rem;">線上預約維修 / 保養</h3>
        <form onsubmit="alert('預約成功！我們將會盡快與您聯繫。'); return false;">
          <div style="margin-bottom: 10px;">
            <label style="display:block; font-size: 0.9rem; margin-bottom: 4px;">姓名</label>
            <input type="text" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 10px;">
            <label style="display:block; font-size: 0.9rem; margin-bottom: 4px;">電話</label>
            <input type="tel" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 15px;">
            <label style="display:block; font-size: 0.9rem; margin-bottom: 4px;">預約項目</label>
            <select style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
              <option>全車定期保養</option>
              <option>煞車 / 變速系統微調</option>
              <option>外胎更換 / 補胎</option>
              <option>新車試乘與諮詢</option>
            </select>
          </div>
          <button type="submit" style="width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">確認送出預約</button>
        </form>
      </div>
    </div>
  </main>

  <!-- ⚠️ 關鍵 2：確認 JS 引入路徑正確 (會自動插入頂部選單與頁尾) -->
  <script src="./js/header.js"></script>
</body>
</html>
