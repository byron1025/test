<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 關於我們</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px 40px; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
    .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: #38bdf8; font-weight: bold; }
    .hero { text-align: center; padding: 80px 0 40px; }
    .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; }
    .hero h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 15px; }
    .hero h1 span { color: #38bdf8; }
    .hero p { font-size: 1.1rem; color: #94a3b8; max-width: 650px; margin: 0 auto 30px; }
    .btn { display: inline-block; background: #38bdf8; color: #0f172a; padding: 10px 24px; border-radius: 25px; font-weight: bold; text-decoration: none; }
    .faq-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .faq-question { padding: 15px 20px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; background: #1e293b; }
    .faq-answer { padding: 15px 20px; color: #94a3b8; font-size: 0.95rem; display: none; border-top: 1px solid #334155; }
    .footer { border-top: 1px solid #1e293b; padding-top: 20px; text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 60px; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="logo">🚲 富國腳踏車店</a>
      <div class="nav-links">
        <a href="index.html" class="active">關於我們</a>
        <a href="services.html">服務與試算</a>
        <a href="products.html">精選車款</a>
        <a href="contact.html">門市資訊</a>
      </div>
    </nav>

    <section class="hero">
      <div class="badge">✦ 專業技術・在地深耕</div>
      <h1>富國腳踏車店 <span>陪伴您踏出每一步精彩騎程</span></h1>
      <p>專營各類自行車銷售、精修保養與改裝升級。我們提供透明的服務流程與專業諮詢，為您的每趟騎程嚴格把關！</p>
      <a href="products.html" class="btn">瀏覽熱門車款</a>
    </section>

    <div style="max-width: 700px; margin: 40px auto 0;">
      <h3 style="text-align: center; margin-bottom: 20px; color: #38bdf8;">❓ 常見問題 FAQ</h3>
      <div class="faq-item">
        <div class="faq-question" onclick="toggleFaq(this)">🚲 新車多久需要做一次大保養？ <span>+</span></div>
        <div class="faq-answer">建議新車騎乘約 500 公里或半年後回店做首次全車檢查調整；之後每年定期進行一次傳動系統清潔與鏈條保養。</div>
      </div>
      <div class="faq-item">
        <div class="faq-question" onclick="toggleFaq(this)">🔧 可以自備零件請店家代工安裝嗎？ <span>+</span></div>
        <div class="faq-answer">可以的！我們提供代工組裝與調整服務，會依照工時與施工難易度收取合理工資。</div>
      </div>
    </div>

    <footer class="footer">© 2026 富國腳踏車店 All Rights Reserved.</footer>
  </div>

  <script>
    function toggleFaq(el) {
      const ans = el.nextElementSibling;
      const show = ans.style.display === 'block';
      ans.style.display = show ? 'none' : 'block';
      el.querySelector('span').innerText = show ? '+' : '−';
    }
  </script>
</body>
</html>
