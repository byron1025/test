<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車款管理後台 - 捷安特富國自行車店</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .admin-container {
      max-width: 600px;
      margin: 2rem auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 2px solid var(--brand-blue);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: var(--primary-blue);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      background-color: var(--brand-blue);
      color: white;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: var(--primary-blue);
    }
    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #status-message {
      margin-top: 1.25rem;
      padding: 0.85rem;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="admin-container">
      <h2 style="color: var(--primary-blue); margin-bottom: 1.5rem; text-align: center;">🚲 新增試乘車款 / 熱門車款</h2>
      
      <form id="bike-form">
        <div class="form-group">
          <label for="bike-category">🏷️ 車款分類</label>
          <select id="bike-category" required>
            <option value="公路車">公路車 (Road)</option>
            <option value="電輔車">電輔車 (E-Bike)</option>
            <option value="登山車">登山車 (MTB)</option>
            <option value="平把運動車">平把運動車 / 休閒車</option>
            <option value="童車">童車 (Youth)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bike-name">🚲 車款名稱</label>
          <input type="text" id="bike-name" placeholder="例如：TCR ADVANCED PRO 0" required>
        </div>

        <div class="form-group">
          <label for="bike-price">💰 車款價格 / 參考售價</label>
          <input type="text" id="bike-price" placeholder="例如：NT$ 128,000 或 歡迎門市洽詢" required>
        </div>

        <div class="form-group">
          <label for="bike-image">📷 上傳車款照片</label>
          <input type="file" id="bike-image" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="bike-specs">📝 車款特色與規格描述</label>
          <textarea id="bike-specs" rows="4" placeholder="例如：超輕量碳纖維車架、Shimano Ultegra Di2 電子變速..." required></textarea>
        </div>

        <div class="form-group">
          <label for="admin-password">🔒 管理員密碼</label>
          <input type="password" id="admin-password" placeholder="請輸入後台密碼" required>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">🚀 上傳照片並新增車款</button>
      </form>

      <div id="status-message"></div>
    </div>
  </main>

  <script src="./js/header.js"></script>

  <script>
    // 最新部署的 GAS 網址
    const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbw6y_Iy4_lUYpRYqpW7nqZSm0tNSeFjyYixMtKkijm6v--OBcPgcwH3Qm4XFtf1NAXz/exec";

    const form = document.getElementById("bike-form");
    const statusMsg = document.getElementById("status-message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const fileInput = document.getElementById("bike-image");
      const file = fileInput.files[0];

      if (!file) {
        alert("請選擇照片！");
        return;
      }

      // 顯示上傳中狀態
      statusMsg.style.display = "block";
      statusMsg.style.backgroundColor = "#e0f2fe";
      statusMsg.style.color = "#0369a1";
      statusMsg.innerHTML = "⏳ 照片處理與資料上傳中，請稍候...";
      submitBtn.disabled = true;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function() {
        const rawBase64 = reader.result.split(',')[1];

        // 📦 傳送給 GAS 的資料（明確指定 action: "add_bike"）
        const payload = {
          action: "add_bike",
          password: document.getElementById("admin-password").value,
          category: document.getElementById("bike-category").value,
          name: document.getElementById("bike-name").value,
          price: document.getElementById("bike-price").value,
          specs: document.getElementById("bike-specs").value,
          fileName: file.name,
          mimeType: file.type,
          fileData: rawBase64
        };

        fetch(BASE_GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          submitBtn.disabled = false;
          if (data.status === "success") {
            statusMsg.style.backgroundColor = "#dcfce7";
            statusMsg.style.color = "#15803d";
            statusMsg.innerHTML = "✅ " + data.message;
            form.reset();
          } else {
            statusMsg.style.backgroundColor = "#fee2e2";
            statusMsg.style.color = "#b91c1c";
            statusMsg.innerHTML = "❌ " + data.message;
          }
        })
        .catch(err => {
          console.error(err);
          submitBtn.disabled = false;
          statusMsg.style.backgroundColor = "#fee2e2";
          statusMsg.style.color = "#b91c1c";
          statusMsg.innerHTML = "❌ 連線失敗，請檢查網路或 GAS 設定！";
        });
      };
    });
  </script>
</body>
</html>
