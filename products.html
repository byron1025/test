<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精選車款與目錄 - 捷安特富國自行車店</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .page-title {
      color: var(--primary-blue, #0284c7);
      margin-bottom: 0.5rem;
    }
    .page-subtitle {
      color: var(--text-muted, #64748b);
      margin-bottom: 2rem;
    }
    /* 分類篩選按鈕列 */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .filter-btn {
      background: white;
      border: 2px solid #cbd5e1;
      color: var(--text-dark, #1e293b);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--brand-blue, #0284c7);
      color: white;
      border-color: var(--brand-blue, #0284c7);
    }
    /* 車款列表 Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .card-price {
      color: #dc2626;
      font-weight: bold;
      font-size: 1.1rem;
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <main class="container" style="padding-top: 2rem;">
    <h1 class="page-title">🚲 精選車款與目錄</h1>
    <p class="page-subtitle">歡迎親臨門市試乘與諮詢，我們提供最專業的選車與調整服務</p>

    <!-- 分類篩選按鈕區 -->
    <div class="filter-bar">
      <button class="filter-btn active" data-category="all">全部車種</button>
      <button class="filter-btn" data-category="公路車">公路車</button>
      <button class="filter-btn" data-category="登山車">登山車</button>
      <button class="filter-btn" data-category="運動健身">運動健身車</button>
      <button class="filter-btn" data-category="電輔車">電輔車</button>
      <button class="filter-btn" data-category="童車">童車與休閒車</button>
    </div>

    <!-- 車款列表容器 -->
    <div class="products-grid" id="products-container">
      <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">
        🔄 正在載入車款資料...
      </div>
    </div>
  </main>

  <script src="./js/header.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbwrzmyOBpf3GHooeExrj_3DJKRx5fPeQ9uuGA7Ro0qmIzj0OxdTzzCVkXk5czyHlVVG/exec";
      const container = document.getElementById("products-container");
      const filterBtns = document.querySelectorAll(".filter-btn");
      let allBikes = []; 

      // 1. 抓取 API 資料
      fetch(BASE_GAS_URL + "?t=" + Date.now())
        .then(res => res.json())
        .then(data => {
          console.log("成功取得 API 資料:", data);
          
          // 自動支援 bikes 或 products 陣列
          allBikes = (data && (data.bikes || data.products)) ? (data.bikes || data.products) : [];

          if (allBikes.length > 0) {
            renderBikes(allBikes); // 成功載入，預設渲染全部車款
          } else {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">🚲 目前尚無車款資料。</div>';
          }
        })
        .catch(err => {
          console.error("載入失敗:", err);
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #dc2626; padding: 2rem;">車款資料載入失敗。</div>';
        });

      // 2. 畫面渲染函式
      function renderBikes(bikes) {
        if (!bikes || bikes.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">此分類目前無相關車款。</div>';
          return;
        }

        container.innerHTML = "";
        bikes.forEach(item => {
          const imgUrl = item.imageUrl || 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600';
          const cardHTML = `
            <article class="card">
              <div class="card-img-wrapper">
                <img src="${imgUrl}" alt="${item.name || '車款圖片'}">
              </div>
              <div class="card-body">
                <span class="tag">${item.category || '精選車款'}</span>
                <h3 class="card-title">${item.name || '精選車款'}</h3>
                ${item.price ? `<p class="card-price">${item.price}</p>` : ''}
                <p class="card-desc">${item.specs || ''}</p>
                <a href="contact.html" class="btn-detail">🔴 預約門市試乘</a>
              </div>
            </article>
          `;
          container.insertAdjacentHTML("beforeend", cardHTML);
        });
      }

      // 3. 按鈕點擊篩選邏輯
      filterBtns.forEach(btn => {
        btn.addEventListener("click", function () {
          filterBtns.forEach(b => b.classList.remove("active"));
          this.classList.add("active");

          const targetCategory = this.getAttribute("data-category");

          if (!targetCategory || targetCategory === "all" || targetCategory === "全部車種") {
            renderBikes(allBikes);
          } else {
            const filtered = allBikes.filter(bike => {
              const cat = (bike.category || "").trim();
              return cat.includes(targetCategory) || targetCategory.includes(cat);
            });
            renderBikes(filtered);
          }
        });
      });

    });
  </script>
</body>
</html>
