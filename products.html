<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 關鍵 RWD Viewport 宣告，允許手機與平板自由縮放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 車款目錄</title>
  
  <!-- 載入通用 CSS 樣式表 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="container">
    <h1 class="page-title">🚴‍♂️ <span>精選車款與目錄</span></h1>
    <p class="page-subtitle">歡迎親臨門市試乘與諮詢，我們提供最專業的選車與調整服務</p>

    <!-- 分類篩選按鈕區 -->
    <div class="filter-group">
      <button class="filter-btn active">全部車種</button>
      <button class="filter-btn">公路車</button>
      <button class="filter-btn">登山車</button>
      <button class="filter-btn">通勤車</button>
      <button class="filter-btn">電輔車</button>
    </div>

    <!-- 車款列表區塊 (支援完全 RWD 自適應縮放) -->
    <div class="product-grid" id="product-container">
      
      <!-- 車款卡片 1 -->
      <article class="card">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600" alt="Fuguo Speed 700C">
        </div>
        <div class="card-body">
          <span class="tag">公路車</span>
          <h3 class="card-title">Fuguo Speed 700C 輕量化公路車</h3>
          <p class="card-desc">採用 16 段 Shimano 變速系統，適合平路巡航與日常運動健身。</p>
          <a href="contact.html" class="btn-detail">🔴 預約門市試乘</a>
        </div>
      </article>

      <!-- 車款卡片 2 -->
      <article class="card">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1576435728678-68d0fbf94e91?w=600" alt="Fuguo Mountain X2">
        </div>
        <div class="card-body">
          <span class="tag">登山車</span>
          <h3 class="card-title">Fuguo Mountain X2 雙碟煞登山車</h3>
          <p class="card-desc">配備前避震鎖定功能與前後機械雙碟煞，輕鬆應付各種崎嶇地形。</p>
          <a href="contact.html" class="btn-detail">🔴 預約門市試乘</a>
        </div>
      </article>

      <!-- 車款卡片 3 -->
      <article class="card">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?w=600" alt="Fuguo City Classic">
        </div>
        <div class="card-body">
          <span class="tag">通勤車</span>
          <h3 class="card-title">Fuguo City Classic 復古通勤車</h3>
          <p class="card-desc">附贈復古車籃與高舒適度座墊，優雅穿梭於城市與巷弄之間。</p>
          <a href="contact.html" class="btn-detail">🔴 預約門市試乘</a>
        </div>
      </article>

    </div>
  </main>

  <!-- 全站統一 Header/Footer 動態載入腳本 -->
  <script src="./js/header.js"></script>

</body>
</html>
