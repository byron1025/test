<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 車款與商品目錄</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="color: #0f172a; font-size: 2rem;">精選車款與目錄</h1>
      <p style="color: #64748b; margin-top: 0.5rem;">歡迎親臨門市試乘與諮詢</p>
    </div>

    <!-- 分類篩選 -->
    <div class="filter-container">
      <button class="filter-btn active" onclick="filterProducts('all', this)">全部車種</button>
      <button class="filter-btn" onclick="filterProducts('road', this)">公路車</button>
      <button class="filter-btn" onclick="filterProducts('mountain', this)">登山車</button>
      <button class="filter-btn" onclick="filterProducts('city', this)">通勤車</button>
      <button class="filter-btn" onclick="filterProducts('ebike', this)">電輔車</button>
    </div>

    <div id="product-list" class="product-grid">
      <p style="text-align: center; grid-column: 1/-1;">車款載入中...</p>
    </div>
  </main>

  <script src="./js/header.js"></script>
  <script>
    let allProducts = [];

    function loadProducts() {
      fetch('../data/products.json')
        .then(res => res.json())
        .then(data => {
          allProducts = data;
          renderProducts(allProducts);
        });
    }

    function renderProducts(products) {
      const container = document.getElementById('product-list');
      if (products.length === 0) {
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">無此分類車款。</p>';
        return;
      }

      container.innerHTML = products.map(item => `
        <div class="product-card">
          <img src="${item.image}" alt="${item.name}" class="product-img" loading="lazy">
          <div class="product-body">
            <span class="product-tag">${item.categoryName}</span>
            <h3 style="font-size: 1.1rem; color: #0f172a; margin-bottom: 6px;">${item.name}</h3>
            <p style="font-size: 0.875rem; color: #64748b; flex-grow: 1;">${item.desc}</p>
            <div class="product-price">${item.price}</div>
          </div>
        </div>
      `).join('');
    }

    function filterProducts(category, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      if (category === 'all') {
        renderProducts(allProducts);
      } else {
        renderProducts(allProducts.filter(item => item.category === category));
      }
    }

    document.addEventListener("DOMContentLoaded", loadProducts);
  </script>
</body>
</html>
