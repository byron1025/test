<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捷安特富國自行車店 - 車款目錄</title>
  
  <meta name="description" content="捷安特富國自行車店精選車款目錄，包含公路車、登山車、通勤車與電輔車，歡迎預約試乘。">
  
  <!-- 載入通用 CSS 樣式表 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="container">
    <h1 class="page-title">🚴‍♂️ <span>精選車款與目錄</span></h1>
    <p class="page-subtitle">歡迎親臨門市試乘與諮詢，我們提供最專業的選車與調整服務</p>

    <!-- 分類篩選按鈕區 -->
    <div class="filter-group" id="filter-group">
      <button class="filter-btn active" data-category="all">全部車種</button>
      <button class="filter-btn" data-category="公路車">公路車</button>
      <button class="filter-btn" data-category="登山車">登山車</button>
      <button class="filter-btn" data-category="通勤車">通勤車</button>
      <button class="filter-btn" data-category="電輔車">電輔車</button>
    </div>

    <!-- 車款列表區塊（透過 JS 動態讀取 JSON 渲染） -->
    <div class="product-grid" id="product-container">
      <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">
        🔄 正在載入車款資料...
      </div>
    </div>
  </main>

  <!-- 全站統一 Header/Footer 動態載入腳本 -->
  <script src="./js/header.js"></script>

  <!-- 動態讀取 site-data.json & 分類篩選腳本 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const productContainer = document.getElementById('product-container');
      const filterBtns = document.querySelectorAll('.filter-btn');

      // 渲染卡片至頁面
      function renderProducts(products) {
        if (!productContainer) return;
        
        if (!products || products.length === 0) {
          productContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">目前尚無該分類的車款資料。</div>';
          return;
        }

        productContainer.innerHTML = "";
        products.forEach(item => {
          const categoryName = item.category || item.type || '精選車款';
          const cardHTML = `
            <article class="card" data-category="${categoryName}">
              <div class="card-img-wrapper">
                <img src="${item.image || item.imgUrl || 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600'}" alt="${item.title || item.name || '精選車款'}">
              </div>
              <div class="card-body">
                <span class="tag">${categoryName}</span>
                <h3 class="card-title">${item.title || item.name || ''}</h3>
                <p class="card-desc">${item.description || item.desc || ''}</p>
                <a href="contact.html" class="btn-detail">🔴 預約門市試乘</a>
              </div>
            </article>
          `;
          productContainer.insertAdjacentHTML('beforeend', cardHTML);
        });
      }

      // 設定分類按鈕點擊事件
      function setupFilter(allProducts) {
        // 初次渲染全部車款
        renderProducts(allProducts);

        filterBtns.forEach(btn => {
          btn.addEventListener('click', function () {
            // 切換按鈕 active 樣式
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const selectedCategory = this.getAttribute('data-category');

            if (selectedCategory === 'all') {
              renderProducts(allProducts);
            } else {
              const filtered = allProducts.filter(item => {
                const cat = item.category || item.type;
                return cat === selectedCategory;
              });
              renderProducts(filtered);
            }
          });
        });
      }

      // 抓取 ./data/site-data.json
      fetch('./data/site-data.json?t=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error("HTTP 錯誤 " + res.status);
          return res.json();
        })
        .then(data => {
          // 自動相容解析：支援 陣列、data.products、data.bikes、data.items
          let list = [];
          if (Array.isArray(data)) {
            list = data;
          } else if (data && typeof data === 'object') {
            list = data.products || data.bikes || data.items || [];
          }
          
          if (list.length > 0) {
            setupFilter(list);
          } else {
            productContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #dc2626; padding: 2rem;">JSON 檔案讀取成功，但裡面沒有找到車款資料陣列。</div>';
          }
        })
        .catch(err => {
          console.error("data/site-data.json 讀取失敗:", err);
          productContainer.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; color: #dc2626; padding: 2rem;">
              <p style="font-weight: bold; font-size: 1.1rem; margin-bottom: 0.5rem;">⚠️ 無法載入車款資料</p>
              <p style="font-size: 0.9rem; color: #64748b;">請確認專案資料夾中是否有 <code>data/site-data.json</code> 檔案，且格式符合標準 JSON 規範。</p>
            </div>
          `;
        });

    });
  </script>
</body>
</html>
