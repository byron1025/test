<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富國腳踏車店 - 服務與試算</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px 40px; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }
    .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; transition: 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: #38bdf8; font-weight: bold; }
    .calc-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; max-width: 600px; margin: 40px auto; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #e2e8f0; font-weight: bold; }
    .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    .calc-result { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; }
    .calc-result span { color: #38bdf8; font-weight: bold; font-size: 1.3rem; }
    .footer { border-top: 1px solid #1e293b; padding-top: 20px; text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 60px; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="logo">🚲 富國腳踏車店</a>
      <div class="nav-links">
        <a href="index.html">關於我們</a>
        <a href="services.html" class="active">服務與試算</a>
        <a href="products.html">精選車款</a>
        <a href="contact.html">門市資訊</a>
      </div>
    </nav>

    <h2 style="text-align: center; margin-top: 40px; color: #38bdf8;">🧮 保養費用與時間線上試算</h2>
    <div class="calc-box">
      <div class="form-group">
        <label>1. 選擇保養套餐：</label>
        <select id="service-type" onchange="calculatePrice()">
          <option value="300">基礎安全檢查 (胎壓/煞車/鏈條上油) - $300</option>
          <option value="800">標準傳動清潔 (鏈條/飛輪超音波清洗) - $800</option>
          <option value="1800">全車細部大保養 (全車拆解潤滑校正) - $1,800</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. 車種選擇：</label>
        <select id="bike-type" onchange="calculatePrice()">
          <option value="1">一般休閒車 / 城市車</option>
          <option value="1.2">公路車 / 登山車 (+20% 施工工時)</option>
          <option value="1.5">電輔車 / 全內走線車款 (+50% 特殊工法)</option>
        </select>
      </div>

      <div class="calc-result">
        預估總費用：<span id="total-price">$300</span><br>
        <small style="color: #94a3b8;" id="total-time">預估施工時間：約 30 分鐘</small>
      </div>
    </div>

    <footer class="footer">© 2026 富國腳踏車店 All Rights Reserved.</footer>
  </div>

  <script>
    function calculatePrice() {
      const base = parseFloat(document.getElementById('service-type').value);
      const multi = parseFloat(document.getElementById('bike-type').value);
      const total = Math.round(base * multi);
      document.getElementById('total-price').innerText = `$${total.toLocaleString()}`;
      let timeText = "約 30 分鐘";
      if (base === 800) timeText = "約 1 ~ 1.5 小時";
      if (base === 1800) timeText = "約 3 ~ 4 小時 (需留車)";
      document.getElementById('total-time').innerText = `預估施工時間：${timeText}`;
    }
  </script>
</body>
</html>
